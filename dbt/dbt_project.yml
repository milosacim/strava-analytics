# dbt project for the Strava analytics medallion pipeline.
# Staging models (silver_layer) clean raw bronze tables; marts (gold_layer) serve analytics.
# Sources, contracts and tests are declared in models/*/schema.yml.
name: strava_analytics
version: '1.0.0'
config-version: 2

profile: strava_analytics

model-paths: ["models"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  strava_analytics:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: silver_layer
      +materialized: table
    marts:
      +schema: gold_layer
      +materialized: table
