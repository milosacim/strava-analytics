version: 2

sources:
  - name: staging_activities
    description: "Strava activities staging table with proper data types and correct units of measure."
    database: strava-dashboard-487415
    schema: silver_layer
    tables:
      - name: stg_activities
models:

  - name: rep_strava__activities
    description: "Weekly aggregation of activities per athlete and sport type. Sourced from stg_strava__activities."
    config:
      tags: [reporting]
    columns:
      - name: date
        description: "ISO-week start date (Monday) the activities are aggregated to."
      - name: year
        description: "Calendar year of the activity start date."
      - name: month
        description: "Calendar month (1-12) of the activity start date."
      - name: week_number
        description: "ISO-week number (1-53) of the activity start date."
      - name: week
        description: "ISO-week label, prefixed with 'W' (e.g. 'W22')."
      - name: athlete_id
        description: "Foreign key referencing stg_strava__athlete.athlete_id."
      - name: sport_type
        description: "Strava sport type aggregated against, e.g. Ride, Run."
      - name: activity_count
        description: "Number of activities in the week for this athlete and sport."
      - name: distance_km
        description: "Total kilometers covered in the week for this athlete and sport."
      - name: longest_km
        description: "Longest single-activity distance in kilometers within the week."
      - name: moving_time_mins
        description: "Total moving time in minutes."
      - name: longest_mins
        description: "Longest single-activity moving time in minutes within the week."
      - name: elapsed_time_mins
        description: "Total elapsed wall-clock time in minutes, including pauses."
      - name: total_elevation_gain
        description: "Total elevation gained in meters."
      - name: max_elevation
        description: "Largest single-activity elevation gain in meters within the week."
      - name: average_speed_kmh
        description: "Average speed in kilometers per hour across activities."
      - name: average_heartrate
        description: "Average heart rate across activities, in beats per minute."
      - name: average_cadence
        description: "Average cadence across activities."
      - name: average_kilojoules
        description: "Average energy spent across activities, in kilojoules."
      - name: average_suffer_score
        description: "Average Strava suffer score across activities."
